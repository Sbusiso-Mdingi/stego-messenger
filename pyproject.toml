[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stego-messenger"
version = "0.4.0"
description = "Open-source research toolkit for evaluating encrypted image steganography"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sbusiso Mdingi" }]
dependencies = [
  "cryptography>=43",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "scikit-image>=0.24",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8.3", "ruff>=0.8", "fastapi>=0.115", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
stego-benchmark = "src.benchmark:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
